#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para Sega Dreamcast (Flycast)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: "flycast"
executable: "flycast"

video:
  backend: "vulkan"
  vsync: true

graphics:
  internal_resolution: "4x"
  texture_filtering: "xbr"
  shader_cache: true

performance:
  multithreading: true
  thread_count: 4
