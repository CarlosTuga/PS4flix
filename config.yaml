#===============================================================================
# Batocera AutoDisc - Ficheiro de Configuração Principal
# Versão: 1.0.0
#===============================================================================

# Definições de hardware e pontos de montagem do sistema
device:
  path: /dev/sr0
  mount_point: /mnt/disc_temp

# Intervalo em segundos para verificar se há alterações no leitor
polling_interval: 2

# Mapeamento padrão de sistemas para emuladores correspondentes no Batocera
emulators:
  psx: duckstation
  ps2: pcsx2
  segacd: retroarch
  saturn: retroarch
  dreamcast: flycast
  gamecube: dolphin
  wii: dolphin
  xbox: xemu
  ps3: rpcs3
  psp: ppsspp

# Configuração de notificações visuais no ecrã (OSD)
notifications:
  enabled: true
  timeout: 5000

# Nível de detalhe dos registos (DEBUG, INFO, WARNING, ERROR)
logging:
  level: INFO

# Configurações de tempo para estabilização de hardware física
timing:
  disc_stabilization: 3
