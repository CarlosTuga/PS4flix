#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para RPCS3 (PlayStation 3)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
# Nota: Sujeito a limitações físicas de leitura direta de discos Blu-ray PS3
#===============================================================================

emulator: rpcs3

video:
  # Vulkan é estritamente necessário para desempenho jogável em RPCS3
  backend: vulkan
  adapter: auto
  fullscreen: true

graphics:
  resolution: 1920x1080
  # Resolução interna em 720p nativo para garantir 60 FPS estáveis na GTX 1060
  internal_resolution: 720p
  # Cache de shaders assíncrono para evitar stutters severos
  shader_cache: true
  texture_caching: true

performance:
  # Ativar multithreading massivo - Crítico para os 12 threads do i7-8700
  multithreading: true
  thread_count: 6
  # Descodificador PPU baseado em LLVM (Compilação prévia super rápida)
  ppu_decoder: llvm
  # Descodificador SPU baseado em ASMJIT/LLVM para máxima taxa de frames
  spu_decoder: asmjit

system:
  region: auto
  bios: auto

debug:
  logging: false
