#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para Redream (Sega Dreamcast)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: redream

video:
  # Utilizar API Vulkan para renderização ultra-fluida
  backend: vulkan
  adapter: auto
  fullscreen: true

graphics:
  resolution: 1920x1080
  # Resolução interna de 4x (qualidade máxima na GTX 1060)
  internal_resolution: 4x
  texture_filtering: xbr
  shader_cache: true

performance:
  # Ativar otimização de CPU multithreading
  multithreading: true

audio:
  backend: alsa
  latency: 100

system:
  region: auto
  bios: auto
