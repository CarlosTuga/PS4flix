#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para DuckStation (PlayStation 1)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: duckstation

video:
  # Utilizar a API gráfica Vulkan para melhor desempenho e menor latência na GTX 1060
  backend: vulkan
  renderer: vulkan
  adapter: auto
  # Ativar V-Sync para evitar screen tearing (rutura de ecrã)
  vsync: true

graphics:
  # Resolução alvo de 1080p
  resolution: 1920x1080
  aspect_ratio: auto
  # Ativar cache de shaders para evitar soluços (stuttering) durante o jogo
  shader_cache: true
  # Filtragem de texturas avançada para melhorar a qualidade visual de jogos retro
  texture_filtering: xbr
  # Multiplicador de resolução interna de 4x (equivalente a 1080p para PS1)
  internal_resolution: 4x

performance:
  # Ativar suporte a multithreading para distribuir a carga pelos cores do i7-8700
  multithreading: true
  # Ativar speedhacks recomendados para emulação fluida
  speed_hacks: true
  # Overclock da CPU emulado (1.0 = padrão para máxima compatibilidade)
  cpu_overclock: 1.0

audio:
  backend: alsa
  sync: true
  latency: 100

system:
  region: auto
  bios: auto
  memory_card: auto

debug:
  logging: false
  shader_dump: false
