#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para Flycast (Sega Dreamcast)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: flycast

video:
  # Utilizar Vulkan para compatibilidade máxima e baixo overhead gráfico
  backend: vulkan
  adapter: auto
  fullscreen: true

graphics:
  resolution: 1920x1080
  # Resolução interna de 4x para renderização ultra-nítida
  internal_resolution: 4x
  # Filtragem xBR para texturas 2D melhoradas
  texture_filtering: xbr
  shader_cache: true

performance:
  # Ativar emulação multithreaded para usar o i7-8700 de forma eficiente
  multithreading: true
  # Número recomendado de threads para emulação estável
  thread_count: 4

audio:
  backend: alsa
  latency: 100

system:
  region: auto
  bios: auto
  memory_card: auto
