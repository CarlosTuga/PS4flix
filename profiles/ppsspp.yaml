#===============================================================================
# Batocera AutoDisc - Perfil Otimizado para PPSSPP (PlayStation Portable)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: ppsspp

video:
  # Utilizar API Vulkan para desempenho ultra-rápido
  backend: vulkan
  adapter: auto
  fullscreen: true

graphics:
  resolution: 1920x1080
  # Resolução interna de 4x (qualidade cristalina)
  internal_resolution: 4x
  texture_filtering: xbr
  shader_cache: true

performance:
  # Ativar multithreading
  multithreading: true
  # Speedhacks recomendados para jogos mais exigentes
  speed_hacks: true
  # Desativar saltos de frames para suavidade máxima
  frameskip: 0

audio:
  backend: alsa
  latency: 100

system:
  region: auto
  bios: auto
  memory_card: auto
