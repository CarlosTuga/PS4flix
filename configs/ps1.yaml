#===============================================================================
# RetroBat AutoDisc - Perfil Otimizado para PlayStation 1 (DuckStation)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: "duckstation"
executable: "emulators\\duckstation\\duckstation-qt-x64-ReleaseLTCG.exe"

video:
  backend: "vulkan"
  vsync: true

graphics:
  internal_resolution: "4x"
  texture_filtering: "xbr"
  shader_cache: true

performance:
  multithreading: true
  speed_hacks: true
