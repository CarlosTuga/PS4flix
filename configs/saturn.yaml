#===============================================================================
# RetroBat AutoDisc - Perfil Otimizado para Sega Saturn (RetroArch/Beetle)
# Otimizado para: Intel Core i7-8700 + NVIDIA GTX 1060 3GB
#===============================================================================

emulator: "retroarch"
executable: "retroarch\\retroarch.exe"
core: "beetle_saturn_libretro.dll"

video:
  backend: "vulkan"
  vsync: true

graphics:
  shader_cache: true

performance:
  multithreading: true
